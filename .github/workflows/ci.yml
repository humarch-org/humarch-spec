# humarch-spec CI (B12 §12.7): re-runs the whole conformance contract on every
# commit — the schema cases, the crypto vectors V0-V6 and W1, the prose-clause
# registry and the SPEC.md mutation pass. The case count deliberately does not
# appear here: it is pinned by tests/schema.test.ts, which is the one place
# that can be wrong and go red. A number repeated in a comment can only go
# stale (it said 21 from v1.4 to v1.6, while the contract said 25).
name: ci
on:
  push:
  pull_request:
  # Advisories land while the repo sits still: re-run the CVE gate weekly
  # (Mon 06:17 UTC), not only on pushes. Manual runs via workflow_dispatch.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Supply-chain hardening (repo-push, 2026-07-16): least-privilege token for
# every job, and third-party actions pinned by full commit SHA — a moved or
# hijacked tag cannot change what runs in this repo's CI.
permissions:
  contents: read

jobs:
  # Residual-risk mandate R3 (audit CVE gap, 2026-07-13): the lockfile is
  # pinned but was never compared against the advisory databases. Blocking
  # on high/critical (user decision); moderate/low findings stay visible in
  # the log without failing the gate. deno audit reads deno.lock natively —
  # osv-scanner has no deno.lock extractor (checked against v2.4.0). A false
  # positive is silenced only by a dated comment here + a pin bump or, if
  # the advisory is wrong, an upstream dispute — never by removing the gate.
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: dependency CVE gate (deno audit, fails on high/critical)
        run: deno audit --level=high

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno task test
